<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Constituency 360 — VANDIRA</title><link rel="stylesheet" href="assets/ai-screen.css?v=102"><style>body{margin:0;background:#faf9f7;color:#171717;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px}.brand{font-weight:800}.brand span{color:#e36b00}.back,.controls button,.controls input{font:inherit;border:1px solid #ddd6ce;border-radius:10px;padding:10px 12px;background:#fff}.back{text-decoration:none;color:#171717}.controls{display:grid;grid-template-columns:1fr auto;gap:10px}.hero,.card{background:#fff;border:1px solid #e5dfd8;border-radius:16px;padding:18px;box-shadow:0 5px 20px #00000008}.hero h1{margin:0 0 5px}.muted{color:#6d675f}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{border:1px solid #eee8e1;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px;margin-top:5px}.section{margin-top:16px}.section h2{font-size:17px}.pill{display:inline-block;border:1px solid #ead9c8;border-radius:999px;padding:5px 9px;margin:3px;background:#fff7ef}.gap{border-left:3px solid #e36b00;padding:10px 12px;background:#fff8f1}.empty{padding:26px;text-align:center;color:#777}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><main class="wrap"><div class="top"><div class="brand">TOP <span>ANALYTICA</span> · VANDIRA</div><a class="back" href="ai.html">AI Workspace</a></div><div class="hero"><h1>Constituency 360</h1><div class="muted">403 Assembly seats — verified baseline + historical + segment context.</div><div class="controls"><input id="q" placeholder="विधानसभा / जिला / AC नंबर खोजें…"><button id="go">Search</button></div><div id="out" class="empty">विधानसभा शोधण्यासाठी नाव किंवा AC नंबर टाका.</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(x){const b=x.baseline_2022||{},l=x.lok_sabha_2024_segment||{},h=x.historical||{};return `<div class="card" style="margin-top:16px"><h2>AC ${x.ac_no} — ${esc(x.constituency)}</h2><div class="muted">${esc(x.district)} · Uttar Pradesh</div><div class="grid"><div class="metric">Winner<b>${esc(b.winner)}</b></div><div class="metric">Winner party<b>${esc(b.winner_party)}</b></div><div class="metric">Margin<b>${b.margin_votes??'—'}</b></div><div class="metric">Turnout<b>${b.turnout_pct!=null?b.turnout_pct+'%':'—'}</b></div><div class="metric">Winner votes<b>${b.winner_votes??'—'}</b></div><div class="metric">Winner share<b>${b.winner_vote_share_pct!=null?b.winner_vote_share_pct+'%':'—'}</b></div><div class="metric">Booths<b>${b.booth_count??'—'}</b></div><div class="metric">2024 LS segment<b>${l.available?'Available':'—'}</b></div></div><div class="section"><h2>Historical context</h2><span class="pill">2012 ${h.results?.['2012']?.winner_party||'—'}</span><span class="pill">2017 ${h.results?.['2017']?.winner_party||'—'}</span><span class="pill">2022 ${b.winner_party||'—'}</span></div><div class="section"><h2>2024 Lok Sabha segment</h2><div class="muted">${l.available?`${esc(l.data?.lok_sabha_constituency||'')} · Winner: ${esc(l.data?.winner_party||'—')} · Margin: ${l.data?.margin_votes??'—'}`:'No mapped segment record returned.'}</div></div><div class="section"><h2>Candidate context</h2>${(x.candidate_context?.candidates||[]).map(c=>`<span class="pill">${esc(c.role)}: ${esc(c.name)} · ${esc(c.party||'—')} · ${c.votes??'—'} votes</span>`).join('')}</div><div class="section"><h2>Booth / Form20</h2><div class="muted">${x.booth_form20?.available?`Booths indexed: ${x.booth_form20.booth_count}; average turnout: ${x.booth_form20.average_turnout_pct??'—'}%`:'Booth summary unavailable for this request.'}</div></div><div class="section gap"><b>Current intelligence</b><br>Fresh retrieval required. This profile does not invent current political developments or 2027 forecasts.</div><div class="section muted">2024 data is Lok Sabha Assembly-segment context, not a 2024 Assembly result.</div></div>`}async function run(){const q=document.getElementById('q').value.trim();if(!q)return;const o=document.getElementById('out');o.className='';o.textContent='Loading…';try{const r=await fetch('/api/constituency-360?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();o.innerHTML=d.results?.length?d.results.map(render).join(''):`<div class="empty">Verified constituency profile not found.</div>`}catch{ o.innerHTML='<div class="empty">Constituency intelligence unavailable.</div>'}}document.getElementById('go').onclick=run;document.getElementById('q').onkeydown=e=>e.key==='Enter'&&run();const ac=new URLSearchParams(location.search).get('ac');if(ac){document.getElementById('q').value='AC '+ac;run();}</script><script src="assets/mobile-runtime.js" defer></script></body></html>

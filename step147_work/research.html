<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research & Survey Intelligence — VANDIRA</title><link rel="stylesheet" href="assets/ai-screen.css?v=106"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><main style="max-width:1100px;margin:0 auto;padding:28px 18px"><a href="ai.html">← VANDIRA</a><h1>Research & Survey Intelligence</h1><p>Survey आणि research evidence ची गुणवत्ता, methodology आणि provenance तपासण्यासाठी deterministic assessment layer.</p><section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:20px 0"><label>Sample size<input id="sample" type="number" min="1" style="display:block;width:100%;padding:11px"></label><label>Constituencies covered<input id="seats" type="number" min="1" max="403" style="display:block;width:100%;padding:11px"></label><label>Fieldwork date<input id="date" type="date" style="display:block;width:100%;padding:11px"></label><label>Margin of error %<input id="moe" type="number" min="0.01" step="0.01" style="display:block;width:100%;padding:11px"></label><label>Methodology<input id="method" placeholder="e.g. stratified random sample" style="display:block;width:100%;padding:11px"></label><label>Sponsor/source<input id="sponsor" placeholder="Organisation / publication" style="display:block;width:100%;padding:11px"></label></section><div style="display:flex;gap:12px;flex-wrap:wrap;margin:12px 0"><label><input id="weight" type="checkbox"> Weighting documented</label><label><input id="questionnaire" type="checkbox"> Questionnaire available</label><button id="assess">Assess Survey</button></div><div style="padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:18px">⚠️ Survey result ≠ election result. Representativeness cannot be established without sampling-frame and fieldwork documentation.</div><pre id="out" style="white-space:pre-wrap;margin-top:22px"></pre></main><script>const $=id=>document.getElementById(id);$('assess').onclick=async()=>{const body={sample_size:$('sample').value,constituencies_covered:$('seats').value,fieldwork_date:$('date').value,margin_of_error:$('moe').value,methodology:$('method').value,sponsor:$('sponsor').value,weighting_documented:$('weight').checked,questionnaire_available:$('questionnaire').checked};$('out').textContent='Assessing…';try{const r=await fetch('/api/research-survey-intelligence',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body),cache:'no-store'});$('out').textContent=JSON.stringify(await r.json(),null,2)}catch(e){$('out').textContent='Unable to assess survey metadata.'}};</script><script src="assets/mobile-runtime.js" defer></script></body></html>

<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Candidate 360 — VANDIRA</title><link rel="stylesheet" href="assets/ai-screen.css?v=101"><style>body{margin:0;background:#faf9f7;color:#171717;font-family:system-ui,-apple-system,"Noto Sans Devanagari",sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.02em}.brand span{color:#e36b00}.back{color:#171717;text-decoration:none;border:1px solid #ddd6ce;border-radius:10px;padding:9px 12px;background:#fff}.hero,.card{background:#fff;border:1px solid #e5dfd8;border-radius:16px;padding:18px;box-shadow:0 5px 20px #00000008}.hero h1{margin:0 0 6px;font-size:28px}.muted{color:#6d675f}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.metric{border:1px solid #eee8e1;border-radius:12px;padding:13px}.metric b{display:block;font-size:20px;margin-top:4px}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin:14px 0}.controls input,.controls button{font:inherit;border:1px solid #ddd6ce;border-radius:10px;padding:11px;background:#fff}.controls button{background:#171717;color:#fff;cursor:pointer}.section{margin-top:16px}.section h2{font-size:17px}.pill{display:inline-block;border:1px solid #ead9c8;border-radius:999px;padding:5px 9px;margin:3px;background:#fff7ef}.gap{border-left:3px solid #e36b00;padding:8px 12px;background:#fff8f1}.empty{padding:28px;text-align:center;color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.top{align-items:flex-start}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><main class="wrap"><div class="top"><div class="brand">TOP <span>ANALYTICA</span> · VANDIRA</div><a class="back" href="ai.html">AI Workspace</a></div><div class="hero"><h1>Candidate 360</h1><div class="muted">उम्मीदवार की verified election intelligence एकाच जागी.</div><div class="controls"><input id="q" placeholder="उम्मीदवार / विधानसभा / जिला खोजें…"><button id="go">Search</button></div><div id="out" class="empty">उम्मीदवार शोधण्यासाठी नाव किंवा विधानसभा टाका.</div></div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(x){const p=x.performance||{},b=x.booth_context||{};return `<div class="card"><h2>${esc(x.name)}</h2><div class="muted">${esc(x.party||'Party unavailable')} · ${esc(x.role)} · AC ${x.identity.ac_no} · ${esc(x.identity.constituency)}, ${esc(x.identity.district)}</div><div class="grid"><div class="metric">Votes<b>${p.votes??'—'}</b></div><div class="metric">Vote share<b>${p.vote_share_pct!=null?p.vote_share_pct+'%':'—'}</b></div><div class="metric">Margin (winner)<b>${p.margin_if_winner_votes??'—'}</b></div><div class="metric">Seat turnout<b>${p.seat_turnout_pct!=null?p.seat_turnout_pct+'%':'—'}</b></div><div class="metric">Booths<b>${p.seat_booth_count??b.booth_count??'—'}</b></div><div class="metric">Form20 name<b>${x.form20_context?.name_present?'Yes':'Not established'}</b></div></div><div class="section"><h2>Historical context</h2><span class="pill">2022 baseline</span><span class="pill">Trend: insufficient time series</span></div><div class="section gap"><b>Current intelligence</b><br>${esc(x.current_intelligence?.note||'Fresh retrieval required.')}</div><div class="section muted">Source: ECI-normalized warehouse · Form20 context additive · Current news not inferred.</div></div>`}async function run(){const q=document.getElementById('q').value.trim();if(!q)return;const o=document.getElementById('out');o.className='';o.textContent='Loading…';try{const r=await fetch('/api/candidate-360?q='+encodeURIComponent(q),{cache:'no-store'});const d=await r.json();o.innerHTML=d.results?.length?d.results.map(card).join(''):`<div class="empty">No verified candidate profile found for this query.</div>`}catch(e){o.innerHTML='<div class="empty">Candidate intelligence unavailable.</div>'}}document.getElementById('go').onclick=run;document.getElementById('q').onkeydown=e=>e.key==='Enter'&&run();const ac=new URLSearchParams(location.search).get('ac');if(ac){document.getElementById('q').value='AC '+ac;run();}</script><script src="assets/mobile-runtime.js" defer></script></body></html>

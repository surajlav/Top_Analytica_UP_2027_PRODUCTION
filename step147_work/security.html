<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VANDIRA — Audit, Compliance & Security</title><style>body{margin:0;background:#fff;color:#111;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:980px;margin:auto;padding:28px 18px}.brand{font-weight:800;letter-spacing:.08em}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#b45309}h1{font-size:32px;margin:8px 0}.sub{color:#666}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.card{border:1px solid #e8e8e8;border-radius:16px;padding:18px;background:#fff;box-shadow:0 5px 20px #00000008}.value{font-size:20px;font-weight:750;margin-top:8px}.ok{color:#166534}.muted{color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><main><div class="brand">TOP ANALYTICA · VANDIRA</div><div class="eyebrow">Political Intelligence Engine</div><h1>Audit / Compliance / Security</h1><p class="sub">Runtime controls, provenance boundaries and deployment safety. Compliance status is engineering status, not legal certification.</p><section class="grid"><div class="card"><div class="muted">Security Headers</div><div class="value ok">Enabled</div></div><div class="card"><div class="muted">Secret Boundary</div><div class="value ok">Server-side</div></div><div class="card"><div class="muted">Durable Audit</div><div id="audit" class="value">Checking…</div></div></section></main><script>fetch('/api/audit-security',{cache:'no-store'}).then(r=>r.json()).then(x=>{document.getElementById('audit').textContent=x.security.durable_audit_backend==='configured'?'Configured':'Not configured — local summary';}).catch(()=>document.getElementById('audit').textContent='Unavailable');</script><script src="assets/mobile-runtime.js" defer></script></body></html>

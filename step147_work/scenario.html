<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scenario & Decision Support — VANDIRA</title><link rel="stylesheet" href="assets/ai-screen.css?v=107"><style>body{background:#fafafa;color:#161616}main{max-width:1120px;margin:auto;padding:28px 18px}.hero{border:1px solid #e6e0d8;border-radius:18px;padding:24px;background:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}.card{border:1px solid #e6e0d8;border-radius:14px;padding:16px;background:#fff}.muted{color:#666}input,button{padding:11px 13px;border-radius:10px;border:1px solid #d9d2c8}button{cursor:pointer;background:#111;color:#fff}.scenario{border-left:3px solid #e58b00}.warn{background:#fff7e8;border:1px solid #efd9ad;padding:13px;border-radius:12px;margin-top:16px}pre{white-space:pre-wrap;overflow:auto}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#082454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"></head><body><main><p><a href="ai.html">← VANDIRA</a></p><section class="hero"><h1>Scenario & Decision Support</h1><p class="muted">Evidence-based conditional scenarios — not unsupported 2027 predictions.</p><div style="display:flex;gap:10px;flex-wrap:wrap"><input id="q" placeholder="AC number किंवा constituency name" aria-label="Constituency"><button id="go">Analyse</button></div><div class="warn">⚠️ Scenario म्हणजे conditional analysis. Probability, winner किंवा election outcome evidence नसताना तयार केला जात नाही.</div></section><div id="out" class="grid"></div></main><script>const out=document.getElementById('out');document.getElementById('go').onclick=async()=>{const q=document.getElementById('q').value.trim();out.innerHTML='<div class="card">Analysing…</div>';try{const p=/^\d+$/.test(q)?'?ac='+encodeURIComponent(q):'?q='+encodeURIComponent(q);const r=await fetch('/api/scenario-decision-support'+p,{cache:'no-store'});const d=await r.json();if(!d.results?.length){out.innerHTML='<div class="card">Constituency not resolved. Please enter a valid AC number or exact/partial name.</div>';return}const x=d.results[0];out.innerHTML='<div class="card"><h2>AC '+x.ac_no+' — '+x.constituency+'</h2><p>2022 baseline: '+x.baseline_2022.winner+' ('+x.baseline_2022.winner_party+') vs '+x.baseline_2022.runner_up+' ('+x.baseline_2022.runner_up_party+') · margin '+(x.baseline_2022.margin_votes??'—')+'</p></div>'+x.scenario_matrix.map(s=>'<article class="card scenario"><h3>'+s.name+'</h3><p><b>Assumption:</b> '+s.assumption+'</p><p><b>Impact:</b> '+s.impact+'</p><p><b>Watch:</b> '+s.what_to_watch.join(' · ')+'</p><p><b>Evidence needed:</b> '+s.evidence_needed.join(' · ')+'</p></article>').join('')+'<div class="card"><h3>Guardrails</h3><pre>'+JSON.stringify(x.guardrails,null,2)+'</pre></div>'}catch(e){out.innerHTML='<div class="card">Unable to retrieve scenario analysis.</div>'}}</script><script src="assets/mobile-runtime.js" defer></script></body></html>
